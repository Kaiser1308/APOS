name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The default temp dir is an 8.3 short path (C:\Users\RUNNER~1\...), which assertGitRoot compares
      # against Git's long path and rejects. Use the runner's long-named temp directory instead.
      # (The runner context is only available at step level, not in job-level env.)
      - run: npm run check
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          # Some tests run `git commit` in scratch repos and expect a Git identity to exist.
          GIT_AUTHOR_NAME: apos-ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: apos-ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
      - run: npm run build
      - run: npm run skills:check
