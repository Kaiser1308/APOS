stack: go
notes:
  - 'verified locally: Go 1.27.4, gotestsum 1.13.0, go vet. Not verified: staticcheck, govulncheck.'
detect:
  files: [go.mod]
layers:
  L0:
    - id: go-vet
      command: go vet ./...
      format: exit
    - id: staticcheck
      command: staticcheck ./...
      format: exit
  L1:
    - id: go-unit
      command: go run "{apos}/scripts/go-junit/main.go" --report "{report}"
      format: junit
  L2:
    - id: go-acceptance
      command: go run "{apos}/scripts/go-junit/main.go" --report "{report}"
      format: junit
      runOne: go run "{apos}/scripts/go-junit/main.go" --report "{report}" --file "{file}" --test "{name}"
  L5:
    - id: govulncheck
      command: govulncheck ./...
      format: exit
loadErrorPatterns: ['build failed', 'undefined:']
noTestsExitCodes: [0]
manifests: [go.mod, go.sum]
testPaths: ['**/*_test.go']
testInfra: [go.mod, go.sum]
assertPatterns: ['\bt\.(?:Error|Errorf|Fatal|Fatalf)\s*\(']
notImplementedPatterns: ['[Nn]ot implemented']
entryRule:
  goModule: true
  importPatterns: ['^\s*import\s+"([^"]+)"']
  allowImports: []
  moduleSeparator: /
  moduleFiles: ['{path}.go']
forbid: ['\bt\.Skip(?:f|Now)?\s*\(']
needsHuman: [go.mod, go.sum, '.github/**']
