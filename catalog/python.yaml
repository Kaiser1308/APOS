# APOS tool catalog. See docs/catalog.md before changing commands.
stack: python
notes:
  - 'verified: pytest 9.0.2 (-o junit_family=xunit1 gives the file attribute; runOne by node id "file::Class::name"). Not verified: ruff (--output-format sarif), mypy, bandit.'
detect:
  files:
    - pyproject.toml
layers:
  L0:
    - id: ruff
      command: ruff check --output-format sarif --output-file {report} .
      format: sarif
    - id: mypy
      command: mypy .
      format: exit
  L1:
    - id: pytest
      command: pytest -o junit_family=xunit1 --junitxml={report} --ignore=tests/acceptance --ignore=tests/integration
      format: junit
  L2:
    - id: pytest-acceptance
      command: pytest -o junit_family=xunit1 tests/acceptance --junitxml={report}
      format: junit
      runOne: pytest -o junit_family=xunit1 "{file}::{within}{name}" --junitxml={report}
  L3:
    - id: pytest-integration
      command: pytest -o junit_family=xunit1 tests/integration --junitxml={report}
      format: junit
      runOne: pytest -o junit_family=xunit1 "{file}::{within}{name}" --junitxml={report}
  L5:
    - id: bandit
      command: bandit -r . -f sarif -o {report}
      format: sarif
loadErrorPatterns:
  - ^collection failure
  - ImportError while importing test module
  - ModuleNotFoundError
  - SyntaxError
testPaths:
  - tests/**
  - '**/test_*.py'
  - '**/*_test.py'
testInfra:
  - '**/conftest.py'
  - pytest.ini
  - tox.ini
  - setup.cfg
  - pyproject.toml
  - '**/__init__.py'
assertPatterns:
  - ^\s*assert\b
  - \bself\.assert\w+\s*\(
  - \bpytest\.raises\s*\(
  - \bpytest\.warns\s*\(
notImplementedPatterns:
  - NotImplementedError
  - not implemented
entryRule:
  importPatterns:
    - ^\s*from\s+([\w.]+)\s+import\s+([^#]+)
    - ^\s*import\s+([\w.]+(?:\s+as\s+\w+)?(?:\s*,\s*[\w.]+(?:\s+as\s+\w+)?)*)
  allowImports:
    - ^(?:__future__|abc|argparse|collections|contextlib|copy|dataclasses|datetime|decimal|enum|functools|itertools|json|logging|math|os|pathlib|pytest|random|re|shutil|string|sys|tempfile|time|typing|unittest|uuid)(?:\.|$)
  moduleSeparator: .
  moduleFiles:
    - '{path}.py'
    - '{path}/__init__.py'
forbid:
  - "@pytest\\.mark\\.(?:skip|skipif|xfail)"
  - \bpytest\.(?:skip|xfail)\s*\(
  - "@unittest\\.(?:skip|expectedFailure)"
  - "#\\s*type:\\s*ignore"
  - "#\\s*nosec"
needsHuman:
  - pyproject.toml
  - requirements*.txt
  - setup.py
  - setup.cfg
  - tox.ini
  - pytest.ini
  - poetry.lock
  - uv.lock
  - .github/**
